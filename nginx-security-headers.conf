# Security headers for every response (included in nginx.conf: at the top
# and again in each location that adds its own header, because nginx drops
# the inherited add_header lines in such a location).
#
# Content-Security-Policy: the page may run only its own scripts (no inline
# ones: the theme script is /theme-init.js), call only its own API, show
# images from itself (plus data:/blob: for photo previews), frame only the
# official 3D tour (vrmir3d.com) and be framed only by itself. A new outside
# service (an image host, an analytics script) must be added here, or the
# browser blocks it: look for "Content-Security-Policy" in the console.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://vrmir3d.com https://*.vrmir3d.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
