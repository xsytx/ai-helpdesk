# Runs the whole SDU Helpdesk: database, Go backend, and the React website.
#
#   docker compose up -d --build     then open http://localhost:3000
#
# Settings come from .env next to this file (copy .env.example). See README.md.

# Pinned so container and volume names (sdu_ai_helpdesk-db-1, ...) stay the
# same no matter which folder the repo is cloned into.
name: sdu_ai_helpdesk

services:
  # The website: the built React app, served by nginx, which also forwards
  # /api and /uploads to the backend so everything is on one address.
  web:
    build: .
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - app
    restart: unless-stopped

  # Go backend (backend/). Applies the database schema itself on startup.
  app:
    build: ./backend
    environment:
      ADDR: ":8080"
      DATABASE_URL: "postgres://campus_forum:${DB_PASSWORD:-campus_forum}@db:5432/campus_forum?sslmode=disable"
      JWT_SECRET_FILE: "/data/jwt.secret"
      UPLOAD_DIR: "/data/uploads"
      BASE_URL: "${PUBLIC_URL:-http://localhost:3000}"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
      # Real email delivery for verification / password reset codes. Left
      # empty, codes are shown on screen instead (local testing only).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # AI chat answers and forum moderation come from the ai_ml service below.
      ML_SERVICE_URL: "${ML_SERVICE_URL:-http://ai_ml:8001}"
      ML_REQUEST_TIMEOUT_SECONDS: "${ML_REQUEST_TIMEOUT_SECONDS:-180}"
      MODERATION_ENABLED: "${MODERATION_ENABLED:-true}"
      CHAT_RETENTION_DAYS: "${CHAT_RETENTION_DAYS:-30}"
    # Only reachable from this computer — used by `npm run dev`. Visitors go
    # through the web service above.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus_forum
      POSTGRES_PASSWORD: "${DB_PASSWORD:-campus_forum}"
      POSTGRES_DB: campus_forum
    # Only reachable from this computer (for database tools like DBeaver).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_forum -d campus_forum"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # AI service (ai_ml/): finds matching FAQ answers and asks the language
  # model to write the reply; also checks new forum posts. The model itself
  # runs in Ollama, installed normally on this computer (so it can use the
  # GPU on any OS) — see README.md. Not reachable by visitors; only the
  # backend talks to it.
  ai_ml:
    build: ./ai_ml
    environment:
      LLM_PROVIDER: ollama
      LLM_MODEL: "${LLM_MODEL:-qwen3.5:4b}"
      # Inside a container 127.0.0.1 is the container itself, so Ollama on
      # the host is reached through host.docker.internal.
      LLM_BASE_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-120}"
      LLM_NUM_PREDICT: "${LLM_NUM_PREDICT:-350}"
    # Makes host.docker.internal work on Linux too (Docker Desktop has it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The ~1.1 GB search model is downloaded on first start into
      # ai_ml/.cache (ignored by git) and reused afterwards — also by run.bat.
      - ./ai_ml/.cache:/app/.cache
      - ml-logs:/app/data/logs
    # For trying the API by hand: http://localhost:8001/docs (this computer only).
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

volumes:
  app-data:
  db-data:
  ml-logs:
