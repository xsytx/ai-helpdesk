<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — SDU Threads</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="index.html">🧵 SDU Threads</a>
    <nav id="site-nav"></nav>
  </header>
  <main>
    <div class="card auth-card">
      <h1>Choose a new password</h1>
      <div id="error" class="error-box hidden"></div>
      <div id="success-box" class="hidden" style="margin-bottom:12px; color:var(--muted); font-size:0.9rem;"></div>
      <form id="reset-form" class="stack">
        <input type="password" id="new-password" placeholder="New password (min. 8 characters)" required minlength="8" />
        <button class="primary" type="submit">Set new password</button>
      </form>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
