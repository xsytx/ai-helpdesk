<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — SDU Threads</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="index.html">🧵 SDU Threads</a>
    <nav id="site-nav"></nav>
  </header>
  <main>
    <div class="card auth-card">
      <h1>Reset your password</h1>
      <div id="error" class="error-box hidden"></div>
      <div id="success-box" class="hidden" style="margin-bottom:12px; color:var(--muted); font-size:0.9rem;"></div>
      <form id="forgot-form" class="stack">
        <input type="email" id="email" placeholder="you@university.edu" required />
        <button class="primary" type="submit">Send reset link</button>
      </form>
      <p class="muted" style="margin-top:14px;"><a href="login.html">Back to log in</a></p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
