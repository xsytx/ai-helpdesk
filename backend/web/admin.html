<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — SDU Threads</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="index.html">🧵 SDU Threads</a>
    <nav id="site-nav"></nav>
  </header>
  <main>
    <h1>Moderation</h1>
    <div id="error" class="error-box hidden"></div>

    <div class="sort-tabs" id="status-tabs">
      <button class="sort-tab" data-status="open">Open reports</button>
      <button class="sort-tab" data-status="resolved">Resolved</button>
    </div>

    <div id="report-list"></div>
    <div class="pager hidden" id="pager">
      <button id="pager-prev">← Prev</button>
      <span class="muted" id="pager-info"></span>
      <button id="pager-next">Next →</button>
    </div>

    <h2 style="margin-top:32px;">Ban / unban a user</h2>
    <div class="card">
      <div class="stack" style="flex-direction:row; gap:8px; align-items:center;">
        <input type="number" id="ban-user-id" placeholder="User ID" style="max-width:140px;" />
        <button type="button" class="primary" id="ban-btn">Ban</button>
        <button type="button" class="link-btn" id="unban-btn">Unban</button>
      </div>
      <p class="muted" style="margin-top:8px;">Find a user's ID on their profile page URL (<code>profile.html?id=…</code>).</p>
    </div>

    <h2 style="margin-top:32px;">FAQ</h2>
    <div id="faq-admin-list"></div>
    <div class="card">
      <h3 style="margin-top:0;">Add an entry</h3>
      <form id="faq-form" class="stack">
        <input type="text" id="faq-question" placeholder="Question" required maxlength="300" />
        <textarea id="faq-answer" placeholder="Answer" required></textarea>
        <input type="number" id="faq-sort" placeholder="Sort order (lower = higher up, default 0)" />
        <button type="submit" class="primary">Add FAQ entry</button>
      </form>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
