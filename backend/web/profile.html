<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — SDU Threads</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="index.html">🧵 SDU Threads</a>
    <nav id="site-nav"></nav>
  </header>
  <main>
    <div id="error" class="error-box hidden"></div>
    <div class="card" id="profile-header">Loading…</div>

    <div class="sort-tabs" id="profile-tabs">
      <button class="sort-tab" data-tab="threads">Threads</button>
      <button class="sort-tab" data-tab="comments">Comments</button>
    </div>

    <div id="profile-list"></div>
    <div class="pager hidden" id="pager">
      <button id="pager-prev">← Prev</button>
      <span class="muted" id="pager-info"></span>
      <button id="pager-next">Next →</button>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
