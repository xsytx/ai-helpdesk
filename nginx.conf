# Apps that show a card for a pasted link (Telegram, WhatsApp, ...) don't
# run JavaScript, so the React app's empty index.html gives them nothing.
# Their requests for pages go to the backend's GET /api/preview/<path>,
# which answers with the og: tags of that question, shared chat, course...
map $http_user_agent $link_preview_bot {
    default 0;
    ~*(TelegramBot|WhatsApp|facebookexternalhit|Facebot|Twitterbot|Slackbot|Discordbot|LinkedInBot|vkShare|SkypeUriPreview|Viber|redditbot|Iframely|Embedly|Pinterestbot|Mattermost|Snapchat) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # No nginx version in the Server header or on error pages.
    server_tokens off;
    # CSP, frame and sniffing protection, referrer and permissions policy:
    # see nginx-security-headers.conf (repeated in locations that add headers).
    include /etc/nginx/snippets/security-headers.conf;

    # Photo uploads to the forum are capped at 5 MB by the backend.
    client_max_body_size 6m;

    # Behind a proxy on the Docker network (Caddy on a server, cloudflared on
    # a laptop) the visitor's address is the last one in X-Forwarded-For;
    # the backend rate-limits by it, so every visitor isn't one address.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Text is sent compressed (~70% smaller, most noticeable on phones):
    # the JS/CSS bundles, the API's JSON, SVG. Not the live streams
    # (text/event-stream notifications, application/x-ndjson chat answers):
    # compressing them would hold their pieces back.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API and uploaded images go to the Go backend.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # Overwrite (not append): the backend rate-limits by the first
        # X-Forwarded-For address, so a client must not be able to set it.
        proxy_set_header X-Forwarded-For $remote_addr;
        # AI chat answers can take a few minutes on a laptop CPU/GPU
        # (backend waits up to ML_REQUEST_TIMEOUT_SECONDS=180); nginx's
        # default 60s would cut them off first.
        proxy_read_timeout 200s;
        # The backend sets nosniff itself: keep one copy (from the snippet).
        proxy_hide_header X-Content-Type-Options;
    }

    # Uploaded files get a new random name whenever they change (a new
    # avatar is a new file), so browsers may keep them for a month.
    location /uploads/ {
        proxy_pass http://app:8080;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header X-Content-Type-Options;
    }

    # Built JS/CSS have content hashes in their names, so cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Floor plans keep their names when redrawn: browsers must re-check them
    # (a quick 304 when unchanged) instead of showing an old copy.
    location /maps/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Barys's animations rarely change: kept for a week, then re-checked.
    location /mascot/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Everything else is a page of the React app (/forum, /settings, ...).
    # The page itself is always re-checked: after a deploy it must name the
    # new bundles (the old ones are gone), or the screen stays blank.
    location / {
        # Link-preview bots asking for a page (not a real file such as
        # /og-image.png) get the backend's preview card instead.
        set $preview $link_preview_bot;
        if (-f $request_filename) {
            set $preview 0;
        }
        error_page 418 = @preview;
        if ($preview = 1) {
            return 418;
        }
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }

    location @preview {
        rewrite ^(.*)$ /api/preview$1 break;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
}
