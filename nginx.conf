server {
    listen 80;
    root /usr/share/nginx/html;

    # Photo uploads to the forum are capped at 5 MB by the backend.
    client_max_body_size 6m;

    # Text is sent compressed (~70% smaller, most noticeable on phones):
    # the JS/CSS bundles, the API's JSON, SVG. Not the live streams
    # (text/event-stream notifications, application/x-ndjson chat answers):
    # compressing them would hold their pieces back.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API and uploaded images go to the Go backend.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # Overwrite (not append): the backend rate-limits by the first
        # X-Forwarded-For address, so a client must not be able to set it.
        proxy_set_header X-Forwarded-For $remote_addr;
        # AI chat answers can take a few minutes on a laptop CPU/GPU
        # (backend waits up to ML_REQUEST_TIMEOUT_SECONDS=180); nginx's
        # default 60s would cut them off first.
        proxy_read_timeout 200s;
    }

    # Uploaded files get a new random name whenever they change (a new
    # avatar is a new file), so browsers may keep them for a month.
    location /uploads/ {
        proxy_pass http://app:8080;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Built JS/CSS have content hashes in their names, so cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Floor plans keep their names when redrawn: browsers must re-check them
    # (a quick 304 when unchanged) instead of showing an old copy.
    location /maps/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Barys's animations rarely change: kept for a week, then re-checked.
    location /mascot/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Everything else is a page of the React app (/forum, /settings, ...).
    # The page itself is always re-checked: after a deploy it must name the
    # new bundles (the old ones are gone), or the screen stays blank.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
