server {
    listen 80;
    root /usr/share/nginx/html;

    # Photo uploads to the forum are capped at 5 MB by the backend.
    client_max_body_size 6m;

    # API and uploaded images go to the Go backend.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # Overwrite (not append): the backend rate-limits by the first
        # X-Forwarded-For address, so a client must not be able to set it.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://app:8080;
    }

    # Built JS/CSS have content hashes in their names, so cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a page of the React app (/forum, /settings, ...).
    location / {
        try_files $uri /index.html;
    }
}
